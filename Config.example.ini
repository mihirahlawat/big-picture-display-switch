[Display]
; External: wake external displays only before a recovery retry. Best when both
; profiles target external monitors and the laptop/internal panel should stay off.
; Extend: wake every connected display. Use when either profile targets an
; internal panel, or External cannot wake the intended monitor.
; None: never use Windows DisplaySwitch as a recovery fallback.
WakeMode=External

[Audio]
; Setup.ps1 writes Config.ini with the selected TV playback endpoint.
; Keep disabled if you only want display switching.
Enabled=0
TvDeviceId=
TvDeviceLabel=TV audio
