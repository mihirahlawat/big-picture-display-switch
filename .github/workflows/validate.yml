name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download temporary AutoHotkey v2 validator
        id: autohotkey
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v2'
          $archive = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v2.zip'

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest' `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^AutoHotkey_2\..*\.zip$' } |
            Select-Object -First 1
          if (-not $asset) {
            throw 'The latest AutoHotkey v2 release does not contain a ZIP archive.'
          }

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -Headers $headers `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $executable = Get-ChildItem `
            -LiteralPath $destination `
            -Recurse `
            -Filter 'AutoHotkey64.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw 'AutoHotkey64.exe was not found in the official archive.'
          }
          "executable=$executable" >> $env:GITHUB_OUTPUT

      - name: Validate PowerShell and AutoHotkey sources
        shell: powershell
        run: |
          .\tests\Validate.ps1 -AutoHotkeyExe '${{ steps.autohotkey.outputs.executable }}'
